version: '3.8'

services:
  reelzgpt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3101:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./public/ffmpeg:/app/public/ffmpeg
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped 